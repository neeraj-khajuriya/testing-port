<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Cyan/Emerald SaaS Backdrop Glow -->
    <radialGradient id="saasUniqueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Pane Gradients -->
    <linearGradient id="appPane1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="appPane2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10403c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#061f1d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="appPaneTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Syntax & Line Glow -->
    <linearGradient id="codeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="codeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="saasGlowFx" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="saasPaneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#saasUniqueGlow)"/>

  <!-- Layer 1 (Bottom): Backend API & Database Layer Pane -->
  <g filter="url(#saasPaneShadow)">
    <path d="M100 162 L36 125 L100 88 L164 125 Z" fill="url(#appPane1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2"/>
    <path d="M36 125 L36 133 L100 170 L100 162 Z" fill="#060e1a"/>
    <path d="M164 125 L164 133 L100 170 L100 162 Z" fill="#0d1b2e"/>

    <!-- Database Schema Nodes & Connectors -->
    <circle cx="68" cy="120" r="4" fill="#00f0ff" filter="url(#saasGlowFx)"/>
    <circle cx="68" cy="120" r="1.5" fill="#ffffff"/>
    <line x1="72" y1="120" x2="96" y2="134" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.4" stroke-dasharray="4 2"/>
    <circle cx="100" cy="136" r="5" fill="#10b981" filter="url(#saasGlowFx)"/>
    <circle cx="100" cy="136" r="2" fill="#ffffff"/>
    <line x1="104" y1="134" x2="128" y2="120" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.4" stroke-dasharray="4 2"/>
    <circle cx="132" cy="118" r="4" fill="#00f0ff" filter="url(#saasGlowFx)"/>
    <circle cx="132" cy="118" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Layer 2 (Middle): Full-Stack Business Logic & Middleware Pane -->
  <g transform="translate(0, -28)" filter="url(#saasPaneShadow)">
    <path d="M100 134 L42 101 L100 68 L158 101 Z" fill="url(#appPane2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2"/>
    <path d="M42 101 L42 108 L100 141 L100 134 Z" fill="#041211"/>
    <path d="M158 101 L158 108 L100 141 L100 134 Z" fill="#0a2926"/>

    <!-- Code Syntax Blocks on Middle Pane -->
    <path d="M60 96 L88 112" stroke="url(#codeGreen)" stroke-width="2.5" stroke-linecap="round" filter="url(#saasGlowFx)"/>
    <path d="M64 104 L80 113" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M106 114 L138 96" stroke="url(#codeCyan)" stroke-width="2.5" stroke-linecap="round" filter="url(#saasGlowFx)"/>
    <path d="M116 122 L132 113" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Layer 3 (Top): Frontend UI Application Window with Code Editor -->
  <g transform="translate(0, -56)" filter="url(#saasPaneShadow)">
    <path d="M100 106 L48 76 L100 46 L152 76 Z" fill="url(#appPaneTop)" stroke="#38bdf8" stroke-width="1.5" filter="url(#saasGlowFx)"/>
    <path d="M48 76 L48 83 L100 113 L100 106 Z" fill="#024e75"/>
    <path d="M152 76 L152 83 L100 113 L100 106 Z" fill="#075985"/>

    <!-- Window Top Header Bar (3 Mac/Browser Dots) -->
    <circle cx="64" cy="71" r="2.2" fill="#f87171" filter="url(#saasGlowFx)"/>
    <circle cx="72" cy="67" r="2.2" fill="#fbbf24" filter="url(#saasGlowFx)"/>
    <circle cx="80" cy="63" r="2.2" fill="#34d399" filter="url(#saasGlowFx)"/>

    <!-- Large Glowing Code Terminal Token </> -->
    <!-- Left Bracket < -->
    <path d="M88 72 L78 77 L88 82" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#saasGlowFx)"/>
    <!-- Slash / -->
    <line x1="104" y1="67" x2="96" y2="87" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" filter="url(#saasGlowFx)"/>
    <!-- Right Bracket > -->
    <path d="M112 72 L122 77 L112 82" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#saasGlowFx)"/>
  </g>

  <!-- Floating Live Pipeline Laser Pulse -->
  <g transform="translate(0, -38)">
    <line x1="100" y1="20" x2="100" y2="46" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#saasGlowFx)"/>
    <circle cx="100" cy="18" r="3.5" fill="#00f0ff" filter="url(#saasGlowFx)"/>
    <circle cx="100" cy="18" r="1.5" fill="#ffffff"/>
  </g>
</svg>
